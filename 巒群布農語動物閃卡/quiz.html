<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>巒群布農語・動物冒險</title><link rel="stylesheet" href="styles.css"></head><body><main class="page adventure-page"><header class="hero"><p class="eyebrow">Luanqun Bunun Adventure</p><h1>動物族語冒險地圖</h1><p>選一位動物夥伴，踏上五個族語關卡。</p><a class="text-button" href="index.html">返回單字閃卡</a></header><section id="character-screen" class="game-screen"><h2>選擇你的動物夥伴</h2><p>從 10 種動物中選一隻開始冒險。</p><div id="character-grid" class="character-grid"></div><button id="enter-map" class="primary" disabled>進入冒險地圖</button></section><section id="map-screen" class="game-screen" hidden><div class="map-header"><div class="player-card"><img id="chosen-character-image" alt="選擇的動物角色"><div><p class="eyebrow">你的夥伴</p><h2 id="chosen-character"></h2></div></div><button id="change-character" class="text-button">更換角色</button></div><div class="map-scene"><div class="mountain mountain-one"></div><div class="mountain mountain-two"></div><div class="map-path"></div><div id="level-map" class="level-map"></div></div></section><section id="level-screen" class="game-screen" hidden><button id="back-map" class="text-button">← 返回冒險地圖</button><div class="quiz-top"><p class="eyebrow" id="level-label">第 1 關</p><span id="quiz-progress">第 1 / 10 題</span></div><h2 id="level-title"></h2><button id="quiz-play" class="primary" hidden>播放題目</button><div id="quiz-area"></div><p id="quiz-feedback" aria-live="polite"></p><p id="quiz-score"></p><button id="restart-level" class="text-button">本關重新開始</button></section><footer class="site-credit"><p>© 2026 Niun的族語教學多媒體應用 製作</p><p>族語語音合成採用：<a href="https://ai-labs.ilrdf.org.tw/hnang-kari-ai-asi-sluhay/" target="_blank" rel="noreferrer">族語 AI 語音合成系統</a></p></footer></main><script src="quiz.js"></script></body></html>
