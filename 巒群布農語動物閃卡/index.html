<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>巒群布農語・動物閃卡</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="hero"><p class="eyebrow">Luanqun Bunun</p><h1>巒群布農語・動物閃卡</h1><p>聽族語、看圖片、翻開提示，循序練習動物單字與例句。</p></header>
    <section id="learning-panel" class="learning" aria-labelledby="learning-title">
      <div class="section-title"><div><p class="eyebrow">自主學習</p><h2 id="learning-title">閃卡練習</h2></div><label><input id="autoplay-toggle" type="checkbox"> 自動播放族語單字與例句</label></div>
      <article class="flashcard"><img id="flashcard-image" src="assets/animal-flashcards/dog.jpg" alt="狗"><div class="card-copy"><p class="label">族語單字</p><h3 id="flashcard-word">asu</h3><p class="label">族語例句</p><p id="flashcard-sentence">Haiza inaak tas-a asu.</p><p id="flashcard-translation" class="translation" hidden></p><div class="actions"><button id="play-word">播放單字</button><button id="play-sentence">播放例句</button><button class="text-button" id="flip-card" hidden>翻看中文提示</button></div></div></article>
      <div class="card-nav"><button class="text-button" id="previous-card">上一張</button><span id="flashcard-progress">1 / 10</span><button class="text-button" id="next-card">下一張</button></div>
      <a id="start-quiz" href="quiz.html" class="primary">進入聽音選圖測驗</a>
    </section>
    <section id="snail-matching" class="quiz" aria-labelledby="snail-matching-title"><p class="eyebrow">跨語別學習</p><h2 id="snail-matching-title">蝸牛族語配對</h2><p>點選蝸牛詞形，再點選相對應的語別。</p><div id="snail-matching-board" class="matching-board"></div><p id="snail-matching-feedback" aria-live="polite"></p></section>
    <section id="quiz-panel" class="quiz" hidden><div class="quiz-top"><p class="eyebrow">聽音選圖</p><span id="quiz-progress">第 1 / 10 題</span></div><h2>請聽族語，選出正確圖片</h2><button id="quiz-play" class="primary">播放題目</button><div id="quiz-choices" class="choices"></div><p id="quiz-feedback" aria-live="polite"></p><p id="quiz-score"></p><button id="restart-quiz" class="text-button">再測一次</button><button id="back-to-flashcards" class="text-button">返回閃卡練習</button></section>
  </main>
  <footer class="site-credit"><p>© 2026 Niun的族語教學多媒體應用 製作</p><p>族語語音合成採用：<a href="https://ai-labs.ilrdf.org.tw/hnang-kari-ai-asi-sluhay/" target="_blank" rel="noreferrer">族語 AI 語音合成系統</a></p></footer>
  <script src="app.js"></script>
</body>
</html>
